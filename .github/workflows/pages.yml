name: Pages

# Publishes site/ (plus the social preview from docs/images/, and
# llms-full.txt built from the docs it concatenates) to
# https://shaunlee.github.io/beanstalkd-rs/.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "README.md"
      - "docs/COMPAT.md"
      - "docs/OPERATIONS.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble the site
        run: |
          mkdir -p _site/images
          cp -R site/. _site/
          cp docs/images/social-preview.png _site/images/
          # Built at deploy time so it always matches main.
          for f in README.md docs/COMPAT.md docs/OPERATIONS.md; do
            printf '<!-- %s -->\n\n' "$f"
            cat "$f"
            printf '\n\n'
          done > _site/llms-full.txt
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
