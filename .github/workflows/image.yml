name: Image

# A v* tag builds the container image for linux/amd64 and linux/arm64 on
# native runners, smoke-tests each, and pushes a multi-arch image to
# ghcr.io/<owner>/<repo> tagged <version>, <major>.<minor> and latest. When
# the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are set, the same image
# is copied to docker.io/shonhen/beanstalkd-rs.
#
# Run it by hand (workflow_dispatch) with an existing tag to publish the image
# of a release made before this workflow existed, or to retry a failed push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.5.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/shonhen/beanstalkd-rs

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag against the Cargo version
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not match the Cargo version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      # The docker-container driver can both --load an image for the smoke
      # test and push by digest; the second build reuses the first's cache.
      - name: Set up buildx
        run: docker buildx create --use --name bstk --driver docker-container
      - name: Build
        run: |
          labels=(
            --label "org.opencontainers.image.title=beanstalkd-rs"
            --label "org.opencontainers.image.description=Drop-in replacement for beanstalkd, written in Rust"
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
            --label "org.opencontainers.image.licenses=MIT"
            --label "org.opencontainers.image.version=$VERSION"
            --label "org.opencontainers.image.revision=$REVISION"
          )
          printf '%s\n' "${labels[@]}" > "$RUNNER_TEMP/labels"
          docker buildx build --platform "$PLATFORM" "${labels[@]}" --load -t beanstalkd-rs:smoke .
      - name: Smoke test
        run: |
          test "$(docker run --rm beanstalkd-rs:smoke --version)" = "beanstalkd-rs $VERSION"
          scripts/docker-smoke.sh beanstalkd-rs:smoke
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push by digest
        run: |
          mapfile -t labels < "$RUNNER_TEMP/labels"
          docker buildx build --platform "$PLATFORM" "${labels[@]}" \
            --output "type=image,name=$GHCR_IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/meta.json" .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")"
          echo "$PLATFORM $digest"
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
          echo "ARCH=${PLATFORM#linux/}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ env.ARCH }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Tags
        run: |
          version="${TAG#v}"
          tags=("$version")
          # A pre-release (0.6.0-rc.1) gets only its own tag.
          case "$version" in
            *-*) ;;
            *) tags+=("${version%.*}" latest) ;;
          esac
          echo "TAGS=${tags[*]}" >> "$GITHUB_ENV"
          echo "tags: ${tags[*]}"
      - name: Log in
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          fi
      - name: Create the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          sources=()
          for d in *; do sources+=("$GHCR_IMAGE@sha256:$d"); done
          [ "${#sources[@]}" = 2 ] || { echo "::error::expected 2 digests, got ${#sources[@]}"; exit 1; }
          annotation="index:org.opencontainers.image.description=Drop-in replacement for beanstalkd, written in Rust"
          targets=()
          for t in $TAGS; do targets+=(-t "$GHCR_IMAGE:$t"); done
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            for t in $TAGS; do targets+=(-t "$DOCKERHUB_IMAGE:$t"); done
          else
            echo "::notice::DOCKERHUB_TOKEN is not set; pushing to ghcr.io only"
          fi
          docker buildx imagetools create --annotation "$annotation" "${targets[@]}" "${sources[@]}"
      - name: Inspect
        run: |
          version="${TAG#v}"
          docker buildx imagetools inspect "$GHCR_IMAGE:$version"
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$version"
          fi
