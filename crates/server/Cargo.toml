[package]
name = "bstkd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A drop-in replacement for beanstalkd in Rust, byte for byte: TLS, authentication, Prometheus metrics and Raft replication"
keywords = ["beanstalkd", "job-queue", "work-queue", "raft", "tls"]
categories = ["command-line-utilities", "network-programming", "asynchronous"]
readme = "README.md"

[[bin]]
name = "beanstalkd-rs"
path = "src/main.rs"

# `cargo binstall bstkd` fetches the release archive instead of
# compiling: the assets are beanstalkd-rs-<version>-<target>.tar.gz and the
# archive holds the binary in a directory of the same name.
# bin-dir names the binary inside the archive, not the directory holding it:
# the release archive keeps the binary, README, docs and packaging files under
# beanstalkd-rs-<version>-<target>/. binstall falls back to compiling from
# source when it cannot find the file at this path.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/beanstalkd-rs-{ version }-{ target }.{ archive-format }"
bin-dir = "beanstalkd-rs-{ version }-{ target }/beanstalkd-rs{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
bytes.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
bstk-proto.workspace = true
bstk-engine.workspace = true
bstk-store.workspace = true
bstk-raft.workspace = true
bstk-net.workspace = true
openraft.workspace = true
nix = { version = "0.29", features = ["hostname", "resource", "signal", "feature"] }
getrandom = "0.2"
serde.workspace = true
serde_json = "1"
toml = "1"
# TLS listeners (rustls with its default aws-lc-rs provider).
rustls = "0.23"
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = "0.26"
# Constant-time token comparison.
subtle = "2"
# The opt-in HTTP listener (/metrics, /healthz, /readyz, /admin).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[dev-dependencies]
tempfile = "3.27.0"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }

[features]
# Test-only membership changes for the integration tests (P6-T1,
# `cluster::test_hooks`): never enabled in a shipped build, and reachable
# only through a command file in the data directory, not the wire, HTTP or
# the command line. `scripts/check.sh` runs the membership tests with it.
test-hooks = []

[lints]
workspace = true
